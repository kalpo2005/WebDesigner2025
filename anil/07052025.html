<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated 3D Circles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            position: absolute;
            top: 5%;
            height: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
            animation: baraiya 20s linear infinite;
            /* Optional full rotation */
        }

        .circle {
            position: absolute;
            /* circle nu background transparent or any color */
            background: transparent;
            /*circle ni ring ni width calculation */
            width: calc(var(--i) * 2.5vmin);
            /* circle ketlu long turn le*/
            aspect-ratio: 0.5;
            /* means height and width same make square */
            border-radius: 50%;
            border: 3px dotted rgb(21, 0, 255);

            transform-style: preserve-3d;
            /* 3d animation mate */
            transform: rotateX(360deg) translateZ(50px);
            animation: anil 3s ease-in-out calc(var(--i) * 0.07s) infinite;
            /* timing set karva mate cal() function */
            box-shadow: 0 0 15px rgb(242, 37, 37),
                inset 0 0 15px rgb(242, 37, 37);
        }

        @keyframes anil {

            0%,
            100% {
                transform: rotateX(70deg) translateZ(50px) translateY(0);
                filter: hue-rotate(0deg);
            }

            50% {
                transform: rotateX(70deg) translateZ(50px) translateY(-50vmin);
                filter: hue-rotate(360deg);
                /* means one by one color rotate thay  */
            }
        }

        @keyframes baraiya {
            from {
                transform: rotateZ(0deg);
            }

            to {
                transform: rotateZ(360deg);
            }
        }

        .core {
            position: absolute;
            width: 2vmin;
            /* means aapel width na 2% px */
            aspect-ratio: 1;
            /* means height and width same make square */
            background-color: lime;
            border-radius: 50%;
            box-shadow: 0 0 30px lime;
            z-index: 2;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="core"></div> <!-- Optional glowing center -->
        <div class="circle" style="--i:0;"></div>
        <div class="circle" style="--i:1;"></div>
        <div class="circle" style="--i:2;"></div>
        <div class="circle" style="--i:3;"></div>
        <div class="circle" style="--i:4;"></div>
        <div class="circle" style="--i:5;"></div>
        <div class="circle" style="--i:6;"></div>
        <div class="circle" style="--i:7;"></div>
        <div class="circle" style="--i:8;"></div>
        <div class="circle" style="--i:9;"></div>
        <div class="circle" style="--i:10;"></div>
        <div class="circle" style="--i:11;"></div>
        <div class="circle" style="--i:12;"></div>
        <div class="circle" style="--i:13;"></div>
        <div class="circle" style="--i:14;"></div>
        <div class="circle" style="--i:15;"></div>
        <div class="circle" style="--i:16;"></div>
        <div class="circle" style="--i:17;"></div>
        <div class="circle" style="--i:18;"></div>
        <div class="circle" style="--i:19;"></div>
        <div class="circle" style="--i:20;"></div>
        <div class="circle" style="--i:21;"></div>
        <div class="circle" style="--i:22;"></div>
        <div class="circle" style="--i:23;"></div>
        <div class="circle" style="--i:24;"></div>
        <div class="circle" style="--i:25;"></div>
        <div class="circle" style="--i:26;"></div>
        <div class="circle" style="--i:27;"></div>
        <div class="circle" style="--i:28;"></div>
        <div class="circle" style="--i:29;"></div>
        <div class="circle" style="--i:30;"></div>

    </div>
</body>

</html>
